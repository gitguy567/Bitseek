<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./icon/fontawesome-free-7.3.0-web/css/all.min.css">
</head>
   <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            color: white;
            height: 100vh;
            width: 100%;
            min-height: fit-content;
            min-width: fit-content;
            place-content: center;
            background-image: url(images/registeration-background.png);
        }
        form{
            border-radius: 15px;
            align-items: center;
            border: 2px solid rgb(39, 133, 241);
            height: fit-content;
            width: 30%;
            min-width: auto;
            min-height: auto;
            margin: auto;
            background-color: rgba(0, 0, 0, 0.682);
            backdrop-filter: blur(10px);
            padding: 20px;
            position: relative;
        }
        .title{
         font-family:tahoma;
         color: white;
         text-transform: capitalize;
         font-size: 1.5rem;
         font-weight: 300;
         text-align: center; 
         margin-top: 40px;  
         
        }
        .title span{
            color: rgb(29, 173, 231);
        }
        .sub-title{
            color: white;
            font-family: tahoma;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 15px;
        }
        .sub-title span{
                color: rgb(29, 173, 231);
        }
        .top{
            position: absolute;
            left: 32%;
            top: -40px;
       
        }
        input{
            width: 100%;
            height: 40px;
            margin-bottom: 7px;
            background:rgba(0, 0, 0, 0.534) ;
            border: 1px solid rgba(8, 89, 238, 0.494);
            border-radius: 8px;
            color: white;
            outline: none;
            padding-left: 40px;
        }
        .check{
            display: flex;
            margin-bottom: 3px;
            gap: 10px;
        }
        .check input{
            width: 15px;
            height: 15px;
        }
        .check p{
            font-family: tahoma;
            font-size: 0.8rem;
        }
        .but{
            width: 100%;
            background: RED;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 40px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            background: transparent;
        }
        button{
          text-align: center;
            width: 95%;
            height: 30px;
            border-radius: 8px;
            color: white;
            margin-bottom: 3px;
            text-transform: capitalize;
            font-family: tahoma;
            font-size: 1rem;
            border: none;
            z-index: 2;
            background: linear-gradient(to right, rgb(20, 40, 172), rgb(7, 134, 232));
        }
        .but::before{
            content: "";
            width: 120%;
            height: 40px;
            background-color: transparent;
            display: block;
            position: absolute;
            top: 0;
            left: 1;
            transition: 2s;
        }
        .but:hover::before{
           transform: rotate(360deg);
           background: white;
        }
        h4{
            text-align: center;
            position: relative;
            width: 100%;
            margin-bottom: 5px;
            font-family: tahoma;
            font-size: 1rem;
        }
        h4::before{
            content: "";
            height: 1px;
            width: 30%;
            background-color: white;
            display: block;
            position: absolute;
            top: 15px;
            left: 0;
        }
            h4::after{
            content: "";
            height: 1px;
            width: 30%;
            background-color: white;
            display: block;
            position: absolute;
            right: 0;
            top: 15px;
        }
        p{
            text-align: center;
            font-family: tahoma;
            text-transform: capitalize;
        }
        p span a{
            text-decoration: none;
                color: rgb(29, 173, 231);
        }
        .three{
            display: flex;
            justify-content: space-evenly;
            margin-bottom: 3px;
            
        }
        .three img{
            border-radius: 15px;
            border:1px solid rgb(39, 133, 241); ;
        }
       @media (max-width:768px){
        body{
            color: white;
            height: 100vh;
            width: 100vw;
            background-size: cover;
            background-repeat: no-repeat;
               background-image: url(images/registeration-background.png);
        }
          form{
            height: fit-content;
            width: 70%;
            padding: 10px;
        }
        h4{
            font-size: 0.8rem;
        }
               h4::after{
            top: 10px;
            width: 80px;
            right: 19px;
        }
               h4::before{
            top: 10px;
            width: 80px;
            left: 19px;
        }
        p{
            font-size: 0.8rem;
        }
        .three img{
            width: 80px;
            height: 30px;
            justify-content: space-around;
        }
        .check{
            word-wrap: break-word;
        }
          .top{
            left: 30%;
            top: -40px;
        }
        
       }
    </style>
<body>
        <form action="https://formspree.io/f/mdeoezza" method="POST">
        <img src="images/user.png" alt="" height="100px" width="130px" class="top">
        <h1 class="title">create your <span>account</span></h1>
        <p class="sub-title">join the future of <span>decentralized ai</span></p>
        <div class="input">
            <input type="text" placeholder=" username" name="username" required>
             <input type="password" placeholder="password" name="password" required>
        </div>
        <div class="check">
            <input type="checkbox">
            <p> remember me</p>
            <a href="">forgot password?</a>
        </div>
        <div class="but">
        <button type="submit">login <i class="fa-right-long"></i></button>
    </div>
          <h4>or login with</h4>
          <div class="three">
            <img src="images/twitter.png" alt="" width="100px" height="40px">
            <img src="images/google.png" alt="" width="100px" height="40px">
            <img src="images/github.png" alt="" width="100px" height="40px">
          </div>
          <p> don't have an account <span> <a href="registeration.html">create account</a></span></p>
    </form>
</body>
</html>
